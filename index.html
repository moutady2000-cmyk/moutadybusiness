<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbolo</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f7f6;
  color: #222;
  padding-bottom: 80px;
}

header {
  background: #0b8f55;
  color: white;
  padding: 30px 20px;
  text-align: center;
  border-radius: 0 0 25px 25px;
}

header h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

header p {
  font-size: 16px;
}

.search {
  margin: 20px;
}

.search input {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  box-shadow: 0 2px 8px #ddd;
}

.container {
  padding: 0 20px;
}

h2 {
  margin: 20px 0 15px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.category {
  background: white;
  padding: 25px 10px;
  text-align: center;
  border-radius: 15px;
  box-shadow: 0 2px 8px #ddd;
  font-size: 17px;
  font-weight: bold;
}

.sell {
  display: block;
  width: 100%;
  margin: 25px 0;
  padding: 16px;
  background: #0b8f55;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 15px 5px;
  box-shadow: 0 -2px 10px #ddd;
}

.bottom-nav div {
  text-align: center;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
<h1>MBolo</h1>
<p>Achetez, vendez et découvrez près de chez vous</p>
</header>

<div class="search">
<input type="text" placeholder="🔎 Rechercher un produit...">
</div>

<div class="container">

<h2>Catégories</h2>

<div class="categories">
<div class="category">🍎 Alimentation</div>
<div class="category">👕 Mode</div>
<div class="category">📱 Téléphones</div>
<div class="category">🏠 Maison</div>
<div class="category">🚗 Véhicules</div>
<div class="category">🛠️ Services</div>
</div>

<button class="sell">＋ Vendre un produit</button>

</div>

<div class="bottom-nav">
<div>🏠<br>Accueil</div>
<div>🔎<br>Recherche</div>
<div>💬<br>Messages</div>
<div>👤<br>Profil</div>
</div>

</body>
</html>
