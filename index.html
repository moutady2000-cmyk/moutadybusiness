<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Projet Business</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 30px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .hero {
      padding: 50px 20px;
      background: white;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mon Projet Business</h1>
  </header>

  <section class="hero">
    <h2>Bienvenue sur notre site</h2>
    <p>
      Découvrez nos produits et nos services.
      Notre objectif est de vous offrir une expérience simple,
      moderne et professionnelle.
    </p>

    <a class="button" href="mailto:contact@example.com">
      Nous contacter
    </a>
  </section>

  <footer>
    © 2026 Mon Projet Business
  </footer>

</body>
</html>
